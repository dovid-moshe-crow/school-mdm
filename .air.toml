root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/schoolmdm"
  cmd = "go build -o ./tmp/schoolmdm ./cmd/schoolmdm"
  delay = 400
  exclude_dir = ["tmp", "vendor", ".git", ".bin"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  include_ext = ["go", "tpl", "tmpl", "html", "css", "js", "sql", "env"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
